zabbix_export:
  version: "7.0"
  media_types:
    - name: "WhatsApp ConnectZap API"
      type: WEBHOOK
      parameters:
        - name: Authorization
          value: '<token_api>'
        - name: HTTPProxy
          value: ''
        - name: Message
          value: '{ALERT.MESSAGE}'
        - name: Subject
          value: '{ALERT.SUBJECT}'
        - name: To
          value: '{ALERT.SENDTO}'
        - name: Url
          value: 'http://localhost:8080'
      attempts: "1"
      script: |
        // ConnectZap - POST {Url}/sistema/sendText
        // https://www.connectzap.com.br/api
        //
        // A sessao (Authorization) vai no corpo, no campo SessionName.
        // Send to: numero no formato internacional (ex.: 5511999999999).
        var TAG = '[ConnectZap Webhook]';

        function requireParam(params, name) {
            var value = params[name];

            if (typeof value !== 'string' || value.trim() === '') {
                throw 'Parameter "' + name + '" is missing or empty';
            }
            if (/<[^>]+>/.test(value)) {
                throw 'Parameter "' + name + '" still has a placeholder: ' + value;
            }

            return value.trim();
        }

        function buildRequest(params, message) {
            return {
                path: '/sistema/sendText',
                headers: [],
                body: { SessionName: params.Authorization, phonefull: params.To, msg: message },
                secrets: ['SessionName']
            };
        }

        function send(baseurl, proxy, req) {
            var request = new HttpRequest(),
                url = baseurl + req.path,
                logged = {},
                response,
                status,
                key,
                i;

            // Copia do corpo para o log, sem segredos.
            for (key in req.body) {
                if (req.body.hasOwnProperty(key)) {
                    logged[key] = (req.secrets.indexOf(key) !== -1) ? '***' : req.body[key];
                }
            }

            if (proxy) {
                request.setProxy(proxy);
            }

            request.addHeader('Content-Type: application/json');
            for (i = 0; i < req.headers.length; i++) {
                request.addHeader(req.headers[i]);
            }

            Zabbix.log(4, TAG + ' URL: ' + url);
            Zabbix.log(4, TAG + ' params: ' + JSON.stringify(logged));

            response = request.post(url, JSON.stringify(req.body));
            status = request.getStatus();

            Zabbix.log(4, TAG + ' HTTP code: ' + status);
            Zabbix.log(4, TAG + ' response: ' + response);

            if (status < 200 || status >= 300) {
                throw 'HTTP ' + status + ': ' + String(response).substring(0, 300);
            }
        }

        try {
            var params = JSON.parse(value),
                subject = (typeof params.Subject === 'string') ? params.Subject : '',
                body = (typeof params.Message === 'string') ? params.Message : '',
                message,
                baseurl;

            params.Url = requireParam(params, 'Url');
            params.Authorization = requireParam(params, 'Authorization');
            params.To = requireParam(params, 'To');

            if (!/^https?:\/\//i.test(params.Url)) {
                throw 'Parameter "Url" must start with http:// or https://';
            }

            baseurl = params.Url.replace(/\/+$/, '');
            message = (subject !== '') ? subject + '\n' + body : body;

            if (message === '') {
                throw 'Subject and Message are both empty';
            }

            send(baseurl, params.HTTPProxy, buildRequest(params, message));

            return 'OK';
        }
        catch (error) {
            Zabbix.log(3, TAG + ' notification failed: ' + error);
            throw 'Sending failed: ' + error + '.';
        }
      timeout: 10s
      description: |
        Template de Alertas do Zabbix
        
        Alertas de Problemas (Triggers)
           Fonte do Evento: TRIGGERS
           Modo de Operação: PROBLEM
           Assunto: "Problem: {EVENT.NAME}"
           Mensagem:
             Início do problema às `{EVENT.TIME}` em `{EVENT.DATE}`
             Nome do problema: `{EVENT.NAME}`
             Host: `{HOST.NAME}`
             Severidade: `{EVENT.SEVERITY}`
             Dados operacionais: `{EVENT.OPDATA}`
             ID original do problema: `{EVENT.ID}`
             URL do Trigger: `{TRIGGER.URL}`
        
        Alertas de Recuperação (Triggers)
           Fonte do Evento: TRIGGERS
           Modo de Operação: RECOVERY
           Assunto: "Resolved in {EVENT.DURATION}: {EVENT.NAME}"
           Mensagem:
             Problema resolvido em `{EVENT.DURATION}` às `{EVENT.RECOVERY.TIME}` em `{EVENT.RECOVERY.DATE}`
             Nome do problema: `{EVENT.NAME}`
             Host: `{HOST.NAME}`
             Severidade: `{EVENT.SEVERITY}`
             ID original do problema: `{EVENT.ID}`
             URL do Trigger: `{TRIGGER.URL}`
        
        Atualizações de Problemas (Triggers)
           Fonte do Evento: TRIGGERS
           Modo de Operação: UPDATE
           Assunto: "Updated problem: {EVENT.NAME}"
           Mensagem:
             `{USER.FULLNAME}` `{EVENT.UPDATE.ACTION}` o problema em `{EVENT.UPDATE.DATE}` `{EVENT.UPDATE.TIME}`.
             Mensagem de atualização: `{EVENT.UPDATE.MESSAGE}`
             Status atual do problema: `{EVENT.STATUS}`, reconhecimento: `{EVENT.ACK.STATUS}`.
        
        Descoberta de Dispositivos (Discovery)
           Fonte do Evento: DISCOVERY
           Modo de Operação: PROBLEM
           Assunto: "Discovery: {DISCOVERY.DEVICE.STATUS} {DISCOVERY.DEVICE.IPADDRESS}"
           Mensagem:
             Regra de descoberta: `{DISCOVERY.RULE.NAME}`
             IP do dispositivo: `{DISCOVERY.DEVICE.IPADDRESS}`
             DNS do dispositivo: `{DISCOVERY.DEVICE.DNS}`
             Status do dispositivo: `{DISCOVERY.DEVICE.STATUS}`
             Tempo de atividade do dispositivo: `{DISCOVERY.DEVICE.UPTIME}`
             Nome do serviço do dispositivo: `{DISCOVERY.SERVICE.NAME}`
             Porta do serviço do dispositivo: `{DISCOVERY.SERVICE.PORT}`
             Status do serviço do dispositivo: `{DISCOVERY.SERVICE.STATUS}`
             Tempo de atividade do serviço do dispositivo: `{DISCOVERY.SERVICE.UPTIME}`
        
        Auto-registro de Hosts (Auto Registration)
           Fonte do Evento: AUTOREGISTRATION
           Modo de Operação: PROBLEM
           Assunto: "Autoregistration: {HOST.HOST}"
           Mensagem:
             Nome do host: `{HOST.HOST}`
             IP do host: `{HOST.IP}`
             Porta do agente: `{HOST.PORT}`
      message_templates:
          - event_source: TRIGGERS
            operation_mode: PROBLEM
            subject: "❌ *Problem:* {EVENT.NAME}"
            message: |
              🕒 *Problem started:* {EVENT.TIME} on {EVENT.DATE}
              🚩 *Problem name:* {EVENT.NAME}
              💻 *Host:* {HOST.NAME}
              🚨 *Severity:* {EVENT.SEVERITY}
              🔍 *Operational data:* {EVENT.OPDATA}
              🆔 *Original problem ID:* {EVENT.ID}
              🔗 {TRIGGER.URL}

          - event_source: TRIGGERS
            operation_mode: RECOVERY
            subject: "✅ *Resolved:* {EVENT.DURATION}: {EVENT.NAME}"
            message: |
              ⏱️ *Problem resolved:* {EVENT.DURATION} at {EVENT.RECOVERY.TIME} on {EVENT.RECOVERY.DATE}
              🚩 *Problem name:* {EVENT.NAME}
              💻 *Host:* {HOST.NAME}
              🚨 *Severity:* {EVENT.SEVERITY}
              🆔 *Original problem ID:* {EVENT.ID}
              🔗 {TRIGGER.URL}

          - event_source: TRIGGERS
            operation_mode: UPDATE
            subject: "🔄 *Updated problem:* {EVENT.NAME}"
            message: |
              👤 {USER.FULLNAME} {EVENT.UPDATE.ACTION} problem at {EVENT.UPDATE.DATE} {EVENT.UPDATE.TIME}.
              📝 {EVENT.UPDATE.MESSAGE}

              *Current problem status:* {EVENT.STATUS}, acknowledged: {EVENT.ACK.STATUS}.

          - event_source: DISCOVERY
            operation_mode: PROBLEM
            subject: "🔍 Discovery: {DISCOVERY.DEVICE.STATUS} {DISCOVERY.DEVICE.IPADDRESS}"
            message: |
              📡 *Discovery rule:* {DISCOVERY.RULE.NAME}

              🌐 *Device IP:* {DISCOVERY.DEVICE.IPADDRESS}
              🌐 *Device DNS:* {DISCOVERY.DEVICE.DNS}
              📶 *Device status:* {DISCOVERY.DEVICE.STATUS}
              ⏳ *Device uptime:* {DISCOVERY.DEVICE.UPTIME}

              🛠️ *Device service name:* {DISCOVERY.SERVICE.NAME}
              🚪 *Device service port:* {DISCOVERY.SERVICE.PORT}
              📶 *Device service status:* {DISCOVERY.SERVICE.STATUS}
              ⏳ *Device service uptime:* {DISCOVERY.SERVICE.UPTIME}

          - event_source: AUTOREGISTRATION
            operation_mode: PROBLEM
            subject: "📥 Autoregistration: {HOST.HOST}"
            message: |
              💻 *Host name:* {HOST.HOST}
              🌐 *Host IP:* {HOST.IP}
              🚪 *Agent port:* {HOST.PORT}