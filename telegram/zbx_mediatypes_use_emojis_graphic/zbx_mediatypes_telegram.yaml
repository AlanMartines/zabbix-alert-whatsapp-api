zabbix_export:
  version: '7.0'
  media_types:
    - name: 'Telegram Bot - Graphic'
      type: SCRIPT
      script_name: telegram-graph.py
      parameters:
        - sortorder: '0'
          value: '<url_zabbix>'
        - sortorder: '1'
          value: '<zbx_login>'
        - sortorder: '2'
          value: '<zbx_pwd>'
        - sortorder: '3'
          value: '{ITEM.ID1}'
        - sortorder: '4'
          value: '<bot_token>'
        - sortorder: '5'
          value: '{ALERT.SENDTO}'
        - sortorder: '6'
          value: '{ALERT.SUBJECT}'
        - sortorder: '7'
          value: '{ALERT.MESSAGE}'
      status: DISABLED
      attempts: '2'
      attempt_interval: '10s'
      description: |
        Clean Template - Zabbix Alerts via Telegram
        Sends item graph with a compact, readable layout.
        Send to: chat_id, @canal ou chat_id:thread_id.
      message_templates:
        - event_source: TRIGGERS
          operation_mode: PROBLEM
          subject: "❌ *Problem:* {HOST.NAME}"
          message: |
            💻 *Host:* {HOST.NAME} ({HOST.CONN})
            🚨 *Severity:* {EVENT.SEVERITY}
            🚩 *Problem:* {EVENT.NAME}
            📈 *Value:* {ITEM.VALUE1}
            🕒 *Time:* {EVENT.TIME} ({EVENT.DATE})

        - event_source: TRIGGERS
          operation_mode: RECOVERY
          subject: "✅ *Resolved:* {HOST.NAME}"
          message: |
            💻 *Host:* {HOST.NAME} ({HOST.CONN})
            🚩 *Problem:* {EVENT.NAME}
            ⏱️ *Duration:* {EVENT.DURATION}
            🕒 *Resolved:* {EVENT.RECOVERY.TIME} ({EVENT.RECOVERY.DATE})

        - event_source: TRIGGERS
          operation_mode: UPDATE
          subject: "🔄 *Update:* {HOST.NAME}"
          message: |
            👤 *User:* {USER.FULLNAME}
            📝 *Message:* {EVENT.UPDATE.MESSAGE}
            📌 *Status:* {EVENT.STATUS} ({EVENT.ACK.STATUS})

        - event_source: DISCOVERY
          operation_mode: PROBLEM
          subject: "🔍 *Discovery:* {DISCOVERY.DEVICE.IPADDRESS}"
          message: |
            🌐 *IP:* {DISCOVERY.DEVICE.IPADDRESS}
            🛠️ *Service:* {DISCOVERY.SERVICE.NAME}:{DISCOVERY.SERVICE.PORT}
            📶 *Status:* {DISCOVERY.DEVICE.STATUS}

        - event_source: AUTOREGISTRATION
          operation_mode: PROBLEM
          subject: "📥 *Autoregistration:* {HOST.HOST}"
          message: |
            💻 *Host:* {HOST.HOST}
            🌐 *IP:* {HOST.IP}
