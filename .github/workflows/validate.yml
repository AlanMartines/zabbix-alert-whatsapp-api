name: Validate

on:
  push:
    branches: [master]
  pull_request:

# Somente leitura: este workflow não usa nenhum secret.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Validar media types e scripts
        run: python3 tools/validate.py
